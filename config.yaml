# What build.yml builds once a month, for every ABI here, and releases together: PRoot (proot:,
# build-proot.yml) and the rootfs (packages:, rootfs/build.sh)

# Every ABI Google Play supports (the app's jniLibs folders), with what each build calls it:
# - proot: the NDK's name for it (proot/ndk-setup.sh)
# - termux: the rootfs is built in termux/termux-docker:<this> (Termux's name for it)
# - runner: the GitHub runner running that image natively (x86 ones on x86_64, ARM ones on ARM)
# The 64-bit ones are checked for 16 KB pages (32-bit ABIs never run with them)
abis:
  arm64-v8a:   { proot: arm64,  termux: aarch64, runner: ubuntu-24.04-arm }
  armeabi-v7a: { proot: arm,    termux: arm,     runner: ubuntu-24.04-arm }
  x86:         { proot: x86,    termux: i686,    runner: ubuntu-latest }
  x86_64:      { proot: x86_64, termux: x86_64,  runner: ubuntu-latest }

# PRoot and its loaders, cross-compiled with the NDK (proot/build.sh), shipped with the core (the app's
# core module)
proot:
  # A tag, a branch name (master), a commit hash, or latest (its newest tag, as each build finds it);
  # the loaders are built from the same source, so they always match
  repo: termux/proot
  ref: latest
  talloc: latest # Statically linked; latest: its newest release on samba.org
  android_api: 29 # Android 10

# The rootfs, as a tree of parts shipped in the app's jniLibs (lib*.so, so Android unpacks them with
# it), each installed from Play (with the pages of the tools on it) and unpacked when a tool first
# needs it, and deleted (its module uninstalled) once none does:
# - core (libpackage-core.tar.xz.so, with PRoot): what every other part builds on (dash, and what several
#   parts link, e.g. Python's and FFmpeg's OpenSSL and zlib)
# - the others (libpackage-<name>.tar.xz.so): what tools run on
#
# A part says only what it is for; where its dependencies go follows from the tree:
# - packages / pip: the Termux and pip packages it's for (its own programs, data and modules)
# - requires: the parts it builds on (the core, or parts building on it), listed before it; the app
#   installs those first, and lists them with it
# - pip_libs: Termux libraries its pip packages are compiled against (installed before pip)
# - pip_options: options for pip installing them
# - rebuild: Termux packages built with Termux's recipe of them, without some of its configure
#   options (rootfs/termux-build.sh): what they link of their dependencies follows
# - exclude: dependencies to leave out (with what only they need)
# - abis: the ABIs it's built for (abis' names above), when not all of them: e.g. Termux doesn't
#   build its package for one; the app leaves it (and its tools) out there. A part building on one
#   that isn't built for an ABI isn't either (say so). A tool can run on several parts (the
#   Minecraft server: a jdk and cloudflared), its pages a module of their own in the app
# - script: run on the part's files once they're exported (rootfs/<script>, with STAGE: its folder)
# Everything a part's packages use comes along, and only that: the libraries they link, the
# interpreters their scripts run, the data those come with (rootfs/parts.py linked). Termux's
# packages depend on a lot only their tools or their building need; that stays out. What several
# parts use goes to the one they all build on: Python and FFmpeg both link zlib and OpenSSL, so
# those are in the core. In the app, a part lists everything it holds, each with its version.
# Each part has its own version: a release keeps a part's previous archive (and version) as long as
# what goes into it is the same, or its files come out the same (see rootfs/release.py), so the app
# only updates what changed.
packages:
  core:
    packages:
      - dash # $PREFIX/bin/sh for anything shelling out (Android's sh can't run under proot on Samsung)

  python: # Python, for the tools running on it
    requires: [core]
    packages:
      - python

  # Small tools on Python, together (each would be a module of its own otherwise): the QR
  # generator and the currency converter, and the next ones that light
  pypkgs:
    requires: [python]
    pip:
      - qrcode[pil] # QR generator
      - CurrencyConverter # Currency converter
    # Pillow is built against these only (Termux's python-pillow pulls in a lot more)
    pip_libs:
      - libjpeg-turbo
      - zlib
    pip_options: --no-binary pillow

  exiftool: # Metadata editor
    requires: [core]
    packages:
      - exiftool

  ffmpeg: # Video encoder, and yt-dlp's (merging, remuxing, audio conversion, thumbnails)
    # Not on Python: GLib's and libplacebo's packages depend on it, but nothing FFmpeg links does
    requires: [core]
    packages:
      - ffmpeg
    # Built with Termux's recipe (its source, patches and options: x264, x265, VP9, SVT-AV1, dav1d,
    # Opus, MP3, Vorbis, WebP, subtitles), without what the tools don't use: Termux's links every
    # one of these, so it can't start without them (~35 MB)
    rebuild:
      ffmpeg:
        drop:
          # Android's hardware codecs (no tool uses them): they link libandroid, whose libhwui needs
          # what the device's maker added, where the linker doesn't look for a program run from /data
          # (MediaTek: "vendor.mediatek.hardware.mbrain-V2-ndk.so" not found), so FFmpeg can't start
          - --enable-mediacodec
          - --enable-jni # Only MediaCodec needs it
          - --enable-libaom # More AV1 encoders: SVT-AV1 is the one used
          - --enable-librav1e
          - --enable-libplacebo # Vulkan filters (no Vulkan under proot), with glslang
          - --enable-vulkan
          - --enable-opencl
          - --enable-libjxl # JPEG XL
          - --enable-librubberband # Audio filters nothing uses
          - --enable-libmysofa
          - --enable-libbs2b
          - --enable-libbluray # Discs, tracker and game music
          - --enable-libdvdnav
          - --enable-libdvdread
          - --enable-libopenmpt
          - --enable-libgme
          - --enable-libssh # Network protocols nothing uses
          - --enable-libsrt
          - --enable-libzmq
          - --enable-libxcb # X11 screen capture
          - --enable-libxcb-shm
          - --enable-libxcb-xfixes
          - --enable-libxcb-shape
          - --enable-indev=xcbgrab
          - --enable-libv4l2 # Cameras through V4L2
          - --enable-libvmaf # Quality metrics
          - --enable-libxvid # Old or rare encoders (FFmpeg decodes these itself)
          - --enable-libtheora
          - --enable-libopencore-amrnb
          - --enable-libopencore-amrwb
          - --enable-libvo-amrwbenc
        # Not in the recipe (Termux's build host has it): FFmpeg's x86 assembly
        build_packages: [nasm]
    exclude:
      # Fontconfig's DejaVu fonts: it finds Android's in /system/fonts (bound in proot)
      - ttf-dejavu # ~10 MB

  ytdlp: # Media downloader
    requires: [python, ffmpeg]
    packages:
      # qjs: the JavaScript runtime yt-dlp solves YouTube's player challenges with (the app runs it with
      # --js-runtimes quickjs); the solver's scripts come with yt-dlp itself, so no yt-dlp-ejs (it'd pull in Node.js)
      - quickjs-ng
    pip:
      # PyPI's wheel, not Termux's yt-dlp: Termux builds it from the bare git tag, without the generated
      # lazy_extractors.py, so every run imported all ~1800 extractors (each file traced by PRoot) before
      # doing anything. The wheel has them (and the solver's scripts)
      - yt-dlp
      - requests

  # Java, for the tools running on it (the Minecraft server): a part per version, installed by the
  # tool when one of its servers needs it (the newest that runs it, or one already there)
  jdk25: # Java 25: Minecraft 26.1 and later need it (and runs every version from 1.17)
    requires: [core]
    # Termux doesn't build OpenJDK 25 for x86 (upstream dropped 32-bit x86): the part isn't there for
    # it (see rootfs/release.py); Java 17 is
    abis: [arm64-v8a, armeabi-v7a, x86_64]
    packages:
      # Its programs are update-alternatives' links, which aren't exported: jdk.sh links bin/java-25
      - openjdk-25
      # What libandroid-spawn (OpenJDK's) links, rebuilt for 16 KB pages (rootfs/rebuild-16k.sh):
      # Termux's package of it, built before its recipe said so, doesn't depend on it
      - libc++
    exclude:
      # Sound, which none of the tools on it plays: its PulseAudio plugin pulls in PulseAudio, D-Bus
      # and the codecs libsndfile links (FLAC, MP3, Opus, Vorbis), which went to the core as FFmpeg
      # has them too. alsa-lib stays (Java's libjsound links it; it's never loaded headless)
      - alsa-plugins
    script: jdk.sh

  jdk17: # Java 17: Minecraft 1.17 to 1.20.4 (and their mod loaders), on every ABI (x86 too)
    requires: [core]
    packages:
      - openjdk-17 # bin/java-17 (jdk.sh)
      - libc++ # As jdk25's
    exclude:
      - alsa-plugins # As jdk25's
    script: jdk.sh

  cloudflared: # Cloudflare Tunnel, for servers players reach from anywhere (the Minecraft server's)
    requires: [core]
    packages:
      - cloudflared

# Only for building: installed when pip has packages, never in a part (left out with what only
# they need, even as a dependency, as python-yt-dlp's of python-pip)
build_packages:
  - python-pip
  - build-essential # Clang, Make, pkg-config
