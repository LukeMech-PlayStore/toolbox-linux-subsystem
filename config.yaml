# What this repository builds for the app's Linux subsystem (build.yml: monthly, and on every change):
#   android  the app's ABIs
#   proot    PRoot (ships with the core)
#   rootfs   the rootfs, in parts the app installs as Play modules
#   sources  parts built here from source, not from Termux packages (rootfs/<name>/build.sh)


# ------------------------------------------------------------------------------------------------
# android
# ------------------------------------------------------------------------------------------------
android:
  # Every ABI Google Play supports, with its NDK name, its Termux name (termux-docker:<this>) and the
  # runner building it natively. 64-bit ones are checked for 16 KB pages
  abis:
    arm64-v8a:   { ndk_arch: arm64,  termux_arch: aarch64, runner: ubuntu-24.04-arm }
    armeabi-v7a: { ndk_arch: arm,    termux_arch: arm,     runner: ubuntu-24.04-arm }
    x86:         { ndk_arch: x86,    termux_arch: i686,    runner: ubuntu-latest }
    x86_64:      { ndk_arch: x86_64, termux_arch: x86_64,  runner: ubuntu-latest }


# ------------------------------------------------------------------------------------------------
# proot: PRoot and its loaders (proot/build.sh), shipped with the core
# ------------------------------------------------------------------------------------------------
proot:
  # NDK (clang, ndk.sh) and API level (Android 10, the app's oldest). Termux packages, rebuilt ones too,
  # use Termux's own toolchain
  ndk: r30
  api: 29
  # A tag, branch, commit, or latest (newest tag); the loaders come from the same source
  repo: termux/proot
  ref: latest
  talloc: latest # Statically linked; latest: newest Samba tags

# ------------------------------------------------------------------------------------------------
# rootfs: the Linux subsystem (rootfs/build.sh, in termux-docker), as a tree of parts
# ------------------------------------------------------------------------------------------------
# Each part ships as libpackage-<name>.tar.xz.so in a Play module, is unpacked when a tool first needs
# it, and removed once none does. core (with PRoot) is what every other part builds on.
#
# A part's keys:
# - packages / pip: the Termux and pip packages it's for
# - requires: parts it builds on, listed before it (the app installs those first)
# - pip_libs: Termux libraries its pip packages compile against
# - pip_options: options for pip
# - rebuild: Termux packages rebuilt from Termux's recipe without some configure options
#   (rootfs/termux-build.sh)
# - exclude: dependencies to leave out (with what only they need)
# - abis: the ABIs it's built for, when not all (a part on top of it follows, say so)
# - script: run on its exported files (rootfs/<script>, STAGE: its folder)
# - source: built here instead (a name under sources)
# Only what a part's packages use comes along (rootfs/parts.py linked); what several parts use goes to
# the one they share (zlib, OpenSSL: core). A release keeps a part's version while its files stay the
# same (rootfs/release.py), so the app only updates what changed.
rootfs:
  # Only for building (pip), never in a part
  build_packages:
    - python-pip
    - build-essential # Clang, Make, pkg-config

  parts:
    core:
      packages:
        - dash # $PREFIX/bin/sh (Android's sh can't run under proot on Samsung)

    python:
      requires: [core]
      packages:
        - python

    # Small Python tools together (each would be its own module otherwise)
    pypkgs:
      requires: [python]
      pip:
        - qrcode[pil] # QR generator
        - CurrencyConverter # Currency converter
      # Pillow built against these only (Termux's python-pillow pulls in much more)
      pip_libs:
        - libjpeg-turbo
        - zlib
      pip_options: --no-binary pillow

    exiftool: # Metadata editor
      requires: [core]
      packages:
        - exiftool

    ffmpeg: # Video encoder, and yt-dlp's
      requires: [core] # Not python: only GLib's and libplacebo's packages want it
      packages:
        - ffmpeg
      # Termux's recipe without what no tool uses: Termux's links all of it, so it can't start without
      # it (~35 MB)
      rebuild:
        ffmpeg:
          drop:
            # Hardware codecs: libandroid's libhwui needs vendor libraries the linker doesn't find for
            # programs run from /data (MediaTek), so FFmpeg couldn't start
            - --enable-mediacodec
            - --enable-jni # Only MediaCodec needs it
            - --enable-libaom # More AV1 encoders (SVT-AV1 is used)
            - --enable-librav1e
            - --enable-libplacebo # Vulkan (none under proot)
            - --enable-vulkan
            - --enable-opencl
            - --enable-libjxl # JPEG XL
            - --enable-librubberband # Unused audio filters
            - --enable-libmysofa
            - --enable-libbs2b
            - --enable-libbluray # Discs, tracker and game music
            - --enable-libdvdnav
            - --enable-libdvdread
            - --enable-libopenmpt
            - --enable-libgme
            - --enable-libssh # Unused network protocols
            - --enable-libsrt
            - --enable-libzmq
            - --enable-libxcb # X11 capture
            - --enable-libxcb-shm
            - --enable-libxcb-xfixes
            - --enable-libxcb-shape
            - --enable-indev=xcbgrab
            - --enable-libv4l2 # V4L2 cameras
            - --enable-libvmaf # Quality metrics
            - --enable-libxvid # Old encoders (FFmpeg decodes these itself)
            - --enable-libtheora
            - --enable-libopencore-amrnb
            - --enable-libopencore-amrwb
            - --enable-libvo-amrwbenc
          build_packages: [nasm] # x86 assembly (Termux's build host has it)
      exclude:
        - ttf-dejavu # ~10 MB; Fontconfig finds Android's fonts in /system/fonts

    ytdlp: # Media downloader
      requires: [python, ffmpeg]
      packages:
        # JS runtime for YouTube's challenges (--js-runtimes quickjs); no yt-dlp-ejs (it'd pull in Node.js)
        - quickjs-ng
      pip:
        # PyPI's wheel: Termux's lacks lazy_extractors.py, so every run imported ~1800 extractors
        - yt-dlp
        - requests

    # Java for the Minecraft server: a part per version, installed when a server needs it
    jdk25: # Minecraft 26.1+
      requires: [core]
      abis: [arm64-v8a, armeabi-v7a, x86_64] # Termux has no OpenJDK 25 for x86
      packages:
        - openjdk-25 # bin/java-25 (jdk.sh)
        - libc++ # libandroid-spawn's, rebuilt for 16 KB pages (rootfs/rebuild-16k.sh)
      exclude:
        - alsa-plugins # Sound: pulls in PulseAudio, D-Bus and codecs (alsa-lib stays)
      script: jdk.sh

    jdk21: # Minecraft 1.20.5 to 1.21.x
      requires: [core]
      packages:
        - openjdk-21 # bin/java-21 (jdk.sh)
        - libc++ # As jdk25's
      exclude:
        - alsa-plugins # As jdk25's
      script: jdk.sh

    jdk17: # Minecraft 1.17 to 1.20.4 (1.17's Java 16 isn't built for Android)
      requires: [core]
      packages:
        - openjdk-17 # bin/java-17 (jdk.sh)
        - libc++ # As jdk25's
      exclude:
        - alsa-plugins # As jdk25's
      script: jdk.sh

    jdk8: # Minecraft up to 1.16.5 (Termux has no Java older than 17)
      requires: [core] # Its wrapper's sh (dash)
      source: openjdk8

    cloudflared: # Cloudflare Tunnel, for servers reached from anywhere
      requires: [core]
      packages:
        - cloudflared

    bore: # bore.pub's tunnels: a server reached from anywhere at bore.pub:<port>, with no account
      requires: [core]
      packages:
        - bore


# ------------------------------------------------------------------------------------------------
# sources: parts built here (rootfs/<name>/build.sh, build-<name>.yml), each with its own NDK and API
# ------------------------------------------------------------------------------------------------
sources:
  # OpenJDK 8's JRE (jdk8) with rootfs/openjdk8/patches
  openjdk8:
    # The last NDK with GCC, as PojavLauncher's (clang 13+ miscompiles HotSpot 8); its newest API level
    ndk: r10e
    api: 21
    # latest: the newest release (jdk8u<N>-ga); or a tag
    repo: openjdk/jdk8u
    ref: latest
    # armeabi-v7a: OpenJDK's AArch32 port; latest: its newest tag of that release
    repo_arm: openjdk/aarch32-port-jdk8u
    ref_arm: latest
