# What both workflows build: PRoot (proot:, build-proot.yml) and the rootfs (packages:, build-rootfs.yml),
# each for every ABI here

# Every ABI Google Play supports (the app's jniLibs folders), with what each build calls it:
# - proot: the NDK's name for it (proot/ndk-setup.sh)
# - termux: the rootfs is built in termux/termux-docker:<this> (Termux's name for it)
# - runner: the GitHub runner running that image natively (x86 ones on x86_64, ARM ones on ARM)
# The 64-bit ones are checked for 16 KB pages (32-bit ABIs never run with them)
abis:
  arm64-v8a:   { proot: arm64,  termux: aarch64, runner: ubuntu-24.04-arm }
  armeabi-v7a: { proot: arm,    termux: arm,     runner: ubuntu-24.04-arm }
  x86:         { proot: x86,    termux: i686,    runner: ubuntu-latest }
  x86_64:      { proot: x86_64, termux: x86_64,  runner: ubuntu-latest }

# PRoot and its loaders, cross-compiled with the NDK (proot/build.sh); the workflow runs when this
# section, abis (or proot/) changes
proot:
  # A tag, a branch name (master) or a commit hash; the loaders are built from the same source, so
  # they always match
  repo: termux/proot
  ref: v5.1.107.96
  talloc: "2.5.0" # Statically linked
  android_api: 29 # Android 10

# The rootfs comes in parts, shipped in the app's jniLibs (lib*.so, so Android unpacks them with it):
# - base (librootfs.tar.xz.so): what the extensions build on, unpacked when the app first starts
# - extensions (libpackage-<name>.tar.xz.so): the programs a tool runs on, installed (from Play,
#   along with the tool's pages) and unpacked when it's first used, and deleted with its data
# Each lists Termux packages and pip packages: they and their dependencies end up in it, minus
# what the parts it builds on (requires, and always the base) have, and minus what it leaves out
# (exclude: those packages, with what only they need). Of the dependencies, only what its packages
# use: the libraries they link, the interpreters their scripts run and the data those come with
# (Termux's packages depend on a lot only their tools or their building need, see rootfs/parts.py
# linked). What two extensions both need goes to the one they both build on (the base if nothing
# else).
# Each part has its own version: a release keeps a part's previous archive (and version) as long as
# what goes into it is the same, or its files come out the same (see rootfs/release.py), so the app
# only updates what changed.
packages:
  base:
    packages:
      - dash # $PREFIX/bin/sh for anything shelling out (Android's sh can't run under proot on Samsung)

  extensions:
    # The libraries Python and FFmpeg both link (OpenSSL, libffi, zlib, ...) go to the base
    python: # Python, for the packages running on it
      packages:
        - python

    exiftool: # Metadata editor
      packages:
        - exiftool

    qrcode: # QR generator
      requires: [python]
      packages:
        # qrcode[pil]'s Pillow is built against these only (see pip_options)
        - libjpeg-turbo
        - zlib
      pip:
        - qrcode[pil]

    currencyconverter: # Currency converter
      requires: [python]
      pip:
        - CurrencyConverter

    ffmpeg: # Video encoder, and yt-dlp's (merging, remuxing, audio conversion, thumbnails)
      # Not Python: GLib's and libplacebo's packages depend on it, but nothing FFmpeg links does
      packages:
        # Termux's, with its video encoders (x264, x265, VP9, AV1) and filters
        - ffmpeg
      # Not exported, with what only they need
      exclude:
        # Termux's Vulkan loader: libplacebo gets Android's (libvulkan.so), with the GPU's driver.
        # Mesa's software one (~178 MB with LLVM) goes with it, being only ever loaded by it
        - vulkan-loader-generic
        # Fontconfig's DejaVu fonts: it finds Android's in /system/fonts (bound in proot)
        - ttf-dejavu # ~10 MB

    ytdlp: # Media downloader
      requires: [python, ffmpeg]
      packages:
        - yt-dlp

  # For every pip install
  pip_options: --no-binary pillow # Built against the libs above only (Termux's python-pillow pulls in a lot more)

  # Build-only dependencies: installed when pip has packages, never exported (left out of every part,
  # with what only they need, even when a package depends on them, as python-yt-dlp on python-pip)
  build_packages:
    - python-pip
    - build-essential # Clang, Make, pkg-config
