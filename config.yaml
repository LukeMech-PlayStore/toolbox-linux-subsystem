# Termux packages; only they and their dependencies end up in the rootfs.
packages:
  - exiftool # Metadata editor

  # --- DEPEND #1 qrcode[pil] (from Pillow) ---
  - libjpeg-turbo
  - zlib
  # --- END_DEPEND #1 ---

  - python
  - dash # $PREFIX/bin/sh for anything shelling out (Android's sh can't run under proot on Samsung)
pip:
  - qrcode[pil]        # QR Code generator
  - CurrencyConverter  # Currency converter
  - "--no-binary pillow" # Built against the libs above only (Termux's python-pillow pulls in a lot more)

# Build-only dependencies
# These are installed for setup/pip, but their files are not exported (python-pip is added when pip has packages).
build_packages:
  - build-essential  # Clang, Make, pkg-config
