name: Build PRoot

# PRoot and its loaders for every ABI (config.yaml's proot and android sections), cross-compiled with
# the NDK (proot/build.sh): a job of build.yml, whose release ships them with the rootfs. Run by hand, it
# just builds them (an artifact to look at, no release)
on:
  workflow_call:
    outputs:
      proot_ref:
        description: The PRoot ref built (config.yaml's, "latest" resolved)
        value: ${{ jobs.build.outputs.proot_ref }}
      talloc_version:
        description: The talloc version built
        value: ${{ jobs.build.outputs.talloc_version }}
      ndk_version:
        description: The NDK it was built with
        value: ${{ jobs.build.outputs.ndk_version }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PRoot
    runs-on: ubuntu-latest
    outputs:
      proot_ref: ${{ steps.proot.outputs.proot_ref }}
      talloc_version: ${{ steps.proot.outputs.talloc_version }}
      ndk_version: ${{ steps.ndk.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read NDK Version
        id: ndk
        run: echo "version=$(yq -r '.android.ndk' config.yaml)" >> $GITHUB_OUTPUT

      - name: Setup Android NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: setup-ndk
        with:
          ndk-version: ${{ steps.ndk.outputs.version }}

      - name: Build PRoot
        id: proot
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd proot
          chmod +x build.sh
          # Per ABI (jniLibs folder): libproot.so and its loaders, in out/
          ./build.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proot
          path: proot/out/
