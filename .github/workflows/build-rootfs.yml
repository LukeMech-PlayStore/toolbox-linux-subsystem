name: Build Termux Rootfs

on:
  schedule:
    - cron: '0 2 1,15 * *' # Twice a month (1st & 15th) at 02:00 UTC
  workflow_dispatch:
    inputs:
      force_release:
        description: "Force release even if no changes?"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # JOB 1: Calculate Version ID
  # ------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc_ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Calculate Next Version
        id: calc_ver
        run: |
          BASE_VER=$(date +'%y.%m.%d')
          NEW_TAG="$BASE_VER"
          EXISTING_TAGS=$(git tag -l "${BASE_VER}*")
            
          if [[ "$EXISTING_TAGS" == *"$BASE_VER"* ]]; then
             for suffix in a b c d e f g; do
               if [[ "$EXISTING_TAGS" != *"${BASE_VER}${suffix}"* ]]; then
                 NEW_TAG="${BASE_VER}${suffix}"
                 break
               fi
             done
          fi
          echo "version=$NEW_TAG" >> $GITHUB_OUTPUT

  # ------------------------------------------------------------------
  # JOB 2: Build (Parallel)
  # ------------------------------------------------------------------
  build:
    name: Build ${{ matrix.arch }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            image: x86_64
            check_16k: true
          - arch: aarch64
            image: aarch64
            check_16k: true
          # 32-bit ABIs never run with 16 KB pages
          - arch: arm
            image: arm
            check_16k: false
          - arch: x86
            image: i686
            check_16k: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Build Rootfs
        env:
          IMAGE: termux/termux-docker:${{ matrix.image }}
          IMAGE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p out

          if [ -f config.yaml ]; then
            PKGS=$(yq -r '(.packages // [])[]' config.yaml | tr '\n' ' ')
            BUILD_PKGS=$(yq -r '(.build_packages // [])[]' config.yaml | tr '\n' ' ')
            PIP_ARGS=$(yq -r '(.pip // [])[]' config.yaml | tr '\n' ' ')
          else
            echo "No config.yaml found!"
            exit 1
          fi

          # Privileged: ARM images under QEMU need personality() (see termux-docker's README)
          docker run --privileged --name rootfs -v "$PWD/rootfs:/build:ro" "$IMAGE" \
            bash /build/build.sh "$IMAGE_VERSION" "$PKGS" "$BUILD_PKGS" "$PIP_ARGS"

          HOME_DIR=/data/data/com.termux/files/home
          docker cp "rootfs:$HOME_DIR/rootfs" stage
          docker cp "rootfs:$HOME_DIR/out/manifest-pkg.txt" "out/manifest-pkg-${{ matrix.arch }}.txt"
          docker cp "rootfs:$HOME_DIR/out/manifest-pip.txt" "out/manifest-pip-${{ matrix.arch }}.txt"
          docker rm rootfs

          tar --owner=0 --group=0 --numeric-owner -cf - -C stage . | xz -9e -T0 -c > "out/rootfs-${{ matrix.arch }}.tar.xz"
          du -sh stage "out/rootfs-${{ matrix.arch }}.tar.xz"

      - name: Check 16 KB Alignment
        if: matrix.check_16k
        run: |
          # Every ELF must load with 16 KB pages (Android 15+ devices and Android 17 emulators)
          bad=0
          while IFS= read -r -d '' f; do
            for align in $(readelf -lW "$f" 2>/dev/null | awk '$1 == "LOAD" { print $NF }'); do
              if (( align < 16384 )); then
                echo "::error::${f#stage/}: LOAD segment aligned to $align"
                bad=1
                break
              fi
            done
          done < <(find stage -type f -size +0 -print0)
          exit $bad

      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-data-${{ matrix.arch }}
          path: |
            out/rootfs-${{ matrix.arch }}.tar.xz
            out/manifest-pkg-${{ matrix.arch }}.txt
            out/manifest-pip-${{ matrix.arch }}.txt

  # ------------------------------------------------------------------
  # JOB 3: Release & Compare
  # ------------------------------------------------------------------
  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Current Build Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-data-*
          path: current_assets
          merge-multiple: true

      - name: Fetch Previous Release Manifests
        id: fetch_prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev_assets
           
          # 1. Find latest release (Filter out 'proot-')
          LATEST_TAG=$(gh release list --limit 20 --exclude-drafts --exclude-pre-releases --json tagName \
            --jq '.[] | select(.tagName | startswith("proot-") | not) | .tagName' | head -n 1 || echo "")
           
          echo "Latest detected tag: [$LATEST_TAG]"
           
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" == "null" ]; then
            echo "is_initial=true" >> $GITHUB_OUTPUT
            echo "::notice::No previous release found."
          else
            echo "is_initial=false" >> $GITHUB_OUTPUT
            
            # 2. Attempt to download manifests
            for arch in x86_64 aarch64 arm x86; do
              # Termux packages
              if ! gh release download "$LATEST_TAG" -p "manifest-pkg-${arch}.txt" -O "prev_assets/manifest-pkg-${arch}.txt" 2>/dev/null; then
                 echo "No package manifest found for $arch. Treating as new."
                 touch "prev_assets/manifest-pkg-${arch}.txt"
              fi

              # PIP
              if ! gh release download "$LATEST_TAG" -p "manifest-pip-${arch}.txt" -O "prev_assets/manifest-pip-${arch}.txt" 2>/dev/null; then
                 touch "prev_assets/manifest-pip-${arch}.txt"
              fi
            done
          fi

      - name: Generate Unified Changelog
        id: changelog
        run: |
          mkdir -p rows
          CHANGES_DETECTED="false"

          parse_pkg_line() {
            local line="$1"
            pkg="${line%%-[0-9]*}"
            ver="${line#${pkg}-}"
            echo "$pkg $ver"
          }

          parse_pip_line() {
            local line="$1"
            pkg="${line%%==*}"
            ver="${line#${pkg}==}"
            echo "$pkg $ver"
          }

          generate_rows() {
            local arch=$1
            local outfile="rows/${arch}.txt"
            touch "$outfile"

            cat "prev_assets/manifest-pkg-${arch}.txt" "prev_assets/manifest-pip-${arch}.txt" > combined_old.txt
            cat "current_assets/manifest-pkg-${arch}.txt" "current_assets/manifest-pip-${arch}.txt" > combined_new.txt

            declare -A OLD NEW

            # Read Combined OLD
            while read -r line; do
              [ -z "$line" ] && continue
              if [[ "$line" == *==* ]]; then
                read pkg ver <<<"$(parse_pip_line "$line")"
              else
                read pkg ver <<<"$(parse_pkg_line "$line")"
              fi
              OLD["$pkg"]="$ver"
            done < combined_old.txt

            # Read Combined NEW
            while read -r line; do
              [ -z "$line" ] && continue
              if [[ "$line" == *==* ]]; then
                read pkg ver <<<"$(parse_pip_line "$line")"
              else
                read pkg ver <<<"$(parse_pkg_line "$line")"
              fi
              NEW["$pkg"]="$ver"
            done < combined_new.txt

            ALL_PKGS=$(printf "%s\n" "${!OLD[@]}" "${!NEW[@]}" | sort -u)

            for pkg in $ALL_PKGS; do
              old="${OLD[$pkg]}"
              new="${NEW[$pkg]}"
              if [[ -n "$old" && -n "$new" ]]; then
                if [[ "$old" != "$new" ]]; then
                  echo "| ⬆️ | \`$pkg\` | \`$old\` | \`$new\` |" >> "$outfile"
                fi
              elif [[ -n "$old" ]]; then
                echo "| ❌ | \`$pkg\` | \`$old\` | - |" >> "$outfile"
              elif [[ -n "$new" ]]; then
                echo "| 🟢 | \`$pkg\` | - | \`$new\` |" >> "$outfile"
              fi
            done

            sort -o "$outfile" "$outfile"

            if [ -s "$outfile" ]; then
              CHANGES_DETECTED="true"
            fi
            
            rm combined_old.txt combined_new.txt
          }

          generate_rows x86_64
          generate_rows aarch64
          generate_rows arm
          generate_rows x86

          FINAL_LOG=""

          if [ "${{ steps.fetch_prev.outputs.is_initial }}" == "true" ]; then
            CHANGES_DETECTED="true"
            FINAL_LOG="Initial Release."
          elif [ "$CHANGES_DETECTED" == "true" ]; then
            FINAL_LOG+="### 🚀 Changes"$'\n'
            FINAL_LOG+="| ● | Package | Old | New |"$'\n'
            FINAL_LOG+="|:--:|:--------|:----|:-----|"$'\n'
            FINAL_LOG+=$(cat "rows/x86_64.txt")
            
            for arch in aarch64 arm x86; do
              diff_out="rows/${arch}_specific.txt"
              comm -13 rows/x86_64.txt rows/${arch}.txt > "$diff_out"
              if [ -s "$diff_out" ]; then
                FINAL_LOG+=$'\n\n'"### 📦 ${arch} Specifics"$'\n'
                FINAL_LOG+="| ● | Package | Old | New |"$'\n'
                FINAL_LOG+="|:--:|:--------|:----|:-----|"$'\n'
                FINAL_LOG+="$(cat "$diff_out")"
              fi
            done
          fi

          if [ "${{ inputs.force_release }}" == "true" ]; then
            CHANGES_DETECTED="true"
          fi

          echo "needed=$CHANGES_DETECTED" >> $GITHUB_OUTPUT
          printf "full_log<<EOF\n%s\nEOF\n" "$FINAL_LOG" >> $GITHUB_OUTPUT

          
      - name: Package Artifacts
        if: steps.changelog.outputs.needed == 'true'
        run: |
          mkdir -p final_package
          
          package_arch() {
            local SRC_ARCH=$1
            local DEST_DIR=$2
            mkdir -p "final_package/$DEST_DIR"
            if [ -f "current_assets/rootfs-${SRC_ARCH}.tar.xz" ]; then
              mv "current_assets/rootfs-${SRC_ARCH}.tar.xz" \
                  "final_package/$DEST_DIR/librootfs.tar.xz.so"
            fi
          }

          package_arch "x86_64"  "x86_64"
          package_arch "aarch64" "arm64-v8a"
          package_arch "arm"      "armeabi-v7a"
          package_arch "x86"      "x86"

          echo "==> Creating Master Archive..."
          tar -czf rootfs.tar.gz -C final_package .

      - name: Push Release
        if: steps.changelog.outputs.needed == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: Release ${{ needs.prepare.outputs.version }}
          body: |
              ## Automated Build ${{ needs.prepare.outputs.version }}
              Base: [Termux packages](https://github.com/termux/termux-packages)
              ABIs: `armeabi-v7a`, `arm64-v8a`, `x86`, `x86_64`
              
              ${{ steps.changelog.outputs.full_log }}
          files: |
            rootfs.tar.gz
            current_assets/manifest-*.txt
          make_latest: true
