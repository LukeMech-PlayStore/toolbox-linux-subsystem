name: Build Termux Rootfs

on:
  schedule:
    - cron: '0 2 1 * *' # Once a month (1st) at 02:00 UTC
  workflow_dispatch:
    inputs:
      force_release:
        description: "Force release even if no changes?"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # JOB 1: Calculate Version ID
  # ------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc_ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Calculate Next Version
        id: calc_ver
        run: |
          BASE_VER=$(date +'%y.%m.%d')
          NEW_TAG="$BASE_VER"
          EXISTING_TAGS=$(git tag -l "${BASE_VER}*")
            
          if [[ "$EXISTING_TAGS" == *"$BASE_VER"* ]]; then
             for suffix in a b c d e f g; do
               if [[ "$EXISTING_TAGS" != *"${BASE_VER}${suffix}"* ]]; then
                 NEW_TAG="${BASE_VER}${suffix}"
                 break
               fi
             done
          fi
          echo "version=$NEW_TAG" >> $GITHUB_OUTPUT

  # ------------------------------------------------------------------
  # JOB 2: Build (Parallel)
  # ------------------------------------------------------------------
  build:
    name: Build ${{ matrix.arch }}
    needs: prepare
    # Every image runs natively: x86 ones on x86_64 runners, ARM ones on ARM runners
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            image: x86_64
            runner: ubuntu-latest
            check_16k: true
          - arch: aarch64
            image: aarch64
            runner: ubuntu-24.04-arm
            check_16k: true
          # 32-bit ABIs never run with 16 KB pages
          - arch: arm
            image: arm
            runner: ubuntu-24.04-arm
            check_16k: false
          - arch: x86
            image: i686
            runner: ubuntu-latest
            check_16k: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Rootfs
        env:
          IMAGE: termux/termux-docker:${{ matrix.image }}
          IMAGE_VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "out/$ARCH" manifests
          CONFIG=$(yq -o=json -I=0 '.' config.yaml)

          # Privileged: ARM images need personality(), even on ARM hosts (see termux-docker's README)
          docker run --privileged --name rootfs -v "$PWD/rootfs:/build:ro" "$IMAGE" \
            bash /build/build.sh "$IMAGE_VERSION" "$CONFIG"

          HOME_DIR=/data/data/com.termux/files/home
          docker cp "rootfs:$HOME_DIR/rootfs" stage
          docker cp "rootfs:$HOME_DIR/out/." manifests
          docker rm rootfs

          # One archive per part: the base and an extension per feature (see config.yaml). Each is
          # smaller than one -9e block (192 MB), so xz can't split it over threads: the parts are
          # compressed side by side instead
          for dir in stage/*/; do
            part=$(basename "$dir")
            if [ "$part" = base ]; then lib=librootfs.tar.xz.so; else lib="libfeature-$part-rootfs.tar.xz.so"; fi
            tar --owner=0 --group=0 --numeric-owner -cf - -C "$dir" . | xz -9e -T1 -c > "out/$ARCH/$lib" &
            mv "manifests/manifest-$part.txt" "out/manifest-$part-$ARCH.txt"
          done
          for job in $(jobs -p); do wait "$job"; done
          du -sh stage/* out/"$ARCH"/*

      - name: Check 16 KB Alignment
        if: matrix.check_16k
        run: |
          # Every ELF must load with 16 KB pages (Android 15+ devices and Android 17 emulators)
          bad=0
          while IFS= read -r -d '' f; do
            for align in $(readelf -lW "$f" 2>/dev/null | awk '$1 == "LOAD" { print $NF }'); do
              if (( align < 16384 )); then
                echo "::error::${f#stage/}: LOAD segment aligned to $align"
                bad=1
                break
              fi
            done
          done < <(find stage -type f -size +0 -print0)
          exit $bad

      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-data-${{ matrix.arch }}
          path: out/

  # ------------------------------------------------------------------
  # JOB 3: Release & Compare
  # ------------------------------------------------------------------
  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Current Build Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-data-*
          path: current_assets
          merge-multiple: true

      - name: Fetch Previous Release Manifests
        id: fetch_prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev_assets

          # Latest rootfs release (not proot-*)
          LATEST_TAG=$(gh release list --limit 20 --exclude-drafts --exclude-pre-releases --json tagName \
            --jq '.[] | select(.tagName | startswith("proot-") | not) | .tagName' | head -n 1 || echo "")

          echo "Latest detected tag: [$LATEST_TAG]"

          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" == "null" ]; then
            echo "is_initial=true" >> $GITHUB_OUTPUT
            echo "::notice::No previous release found."
          else
            echo "is_initial=false" >> $GITHUB_OUTPUT
            # One per part and ABI; a part missing there (e.g. a new one) counts as all new
            gh release download "$LATEST_TAG" -p 'manifest-*.txt' -D prev_assets || echo "No manifests in $LATEST_TAG"
          fi

      - name: Generate Changelog
        id: changelog
        run: |
          mkdir -p rows
          CHANGES_DETECTED="false"
          ARCHES="x86_64 aarch64 arm x86"
          # Parts as built (manifest-<part>-<arch>.txt), the base first
          PARTS=$(ls current_assets/manifest-*-x86_64.txt | sed 's|.*/manifest-||; s|-x86_64\.txt$||' \
            | awk '{ print ($0 == "base" ? 0 : 1), $0 }' | sort | cut -d' ' -f2)

          # "name-1.2" (Termux) or "name==1.2" (pip) as "name version"
          parse_line() {
            if [[ "$1" == *==* ]]; then
              echo "${1%%==*} ${1#*==}"
            else
              local pkg="${1%%-[0-9]*}"
              echo "$pkg ${1#${pkg}-}"
            fi
          }

          generate_rows() {
            local part=$1 arch=$2
            local outfile="rows/$part-$arch.txt"
            : > "$outfile"
            declare -A OLD NEW
            local line pkg ver
            while read -r line; do
              [ -z "$line" ] && continue
              read -r pkg ver <<<"$(parse_line "$line")"
              OLD["$pkg"]="$ver"
            done < <(cat "prev_assets/manifest-$part-$arch.txt" 2>/dev/null || true)
            while read -r line; do
              [ -z "$line" ] && continue
              read -r pkg ver <<<"$(parse_line "$line")"
              NEW["$pkg"]="$ver"
            done < "current_assets/manifest-$part-$arch.txt"

            for pkg in $(printf "%s\n" "${!OLD[@]}" "${!NEW[@]}" | sort -u); do
              local old="${OLD[$pkg]:-}" new="${NEW[$pkg]:-}"
              if [[ -n "$old" && -n "$new" ]]; then
                if [[ "$old" != "$new" ]]; then echo "| ⬆️ | \`$pkg\` | \`$old\` | \`$new\` |" >> "$outfile"; fi
              elif [[ -n "$old" ]]; then
                echo "| ❌ | \`$pkg\` | \`$old\` | - |" >> "$outfile"
              elif [[ -n "$new" ]]; then
                echo "| 🟢 | \`$pkg\` | - | \`$new\` |" >> "$outfile"
              fi
            done
            sort -o "$outfile" "$outfile"
          }

          TABLE_HEAD="| ● | Package | Old | New |"$'\n'"|:--:|:--------|:----|:-----|"$'\n'
          FINAL_LOG=""
          for part in $PARTS; do
            for arch in $ARCHES; do generate_rows "$part" "$arch"; done
            if [ "$part" = base ]; then lib=librootfs.tar.xz.so; else lib="libfeature-$part-rootfs.tar.xz.so"; fi

            SECTION=""
            if [ -s "rows/$part-x86_64.txt" ]; then
              SECTION+="$TABLE_HEAD$(cat "rows/$part-x86_64.txt")"$'\n'
            fi
            for arch in aarch64 arm x86; do
              comm -13 "rows/$part-x86_64.txt" "rows/$part-$arch.txt" > "rows/$part-$arch-only.txt"
              if [ -s "rows/$part-$arch-only.txt" ]; then
                SECTION+=$'\n'"**$arch only**"$'\n\n'"$TABLE_HEAD$(cat "rows/$part-$arch-only.txt")"$'\n'
              fi
            done
            if [ -n "$SECTION" ]; then
              CHANGES_DETECTED="true"
              FINAL_LOG+="### 📦 $part (\`$lib\`)"$'\n\n'"$SECTION"$'\n'
            fi
          done

          if [ "${{ steps.fetch_prev.outputs.is_initial }}" == "true" ]; then
            CHANGES_DETECTED="true"
            FINAL_LOG="Initial Release."
          elif [ "$CHANGES_DETECTED" == "true" ]; then
            FINAL_LOG="## 🚀 Changes"$'\n\n'"$FINAL_LOG"
          fi

          if [ "${{ inputs.force_release }}" == "true" ]; then
            CHANGES_DETECTED="true"
          fi

          echo "needed=$CHANGES_DETECTED" >> $GITHUB_OUTPUT
          printf "full_log<<EOF\n%s\nEOF\n" "$FINAL_LOG" >> $GITHUB_OUTPUT

      - name: Package Artifacts
        if: steps.changelog.outputs.needed == 'true'
        run: |
          # Every part of an architecture into its ABI's jniLibs folder
          package_arch() {
            mkdir -p "final_package/$2"
            cp current_assets/"$1"/*.so "final_package/$2/"
          }

          package_arch "x86_64"  "x86_64"
          package_arch "aarch64" "arm64-v8a"
          package_arch "arm"     "armeabi-v7a"
          package_arch "x86"     "x86"

          echo "==> Creating Master Archive..."
          tar -czf rootfs.tar.gz -C final_package .

      - name: Push Release
        if: steps.changelog.outputs.needed == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: Release ${{ needs.prepare.outputs.version }}
          body: |
              ## Automated Build ${{ needs.prepare.outputs.version }}
              Base: [Termux packages](https://github.com/termux/termux-packages)
              ABIs: `armeabi-v7a`, `arm64-v8a`, `x86`, `x86_64`
              
              ${{ steps.changelog.outputs.full_log }}
          files: |
            rootfs.tar.gz
            current_assets/manifest-*.txt
          make_latest: true
