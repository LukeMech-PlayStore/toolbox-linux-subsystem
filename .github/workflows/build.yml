name: Build

# Monthly (and on demand): PRoot (build-proot.yml) and the rootfs (build.sh in termux-docker) for every
# ABI, released together: the app gets both from one release (rootfs.tar.gz)

on:
  schedule:
    - cron: '0 2 1 * *' # Once a month (1st) at 02:00 UTC
  # And with every change of what's built (not of the docs alone), always released
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      force_release:
        description: "Force release even if no changes?"
        type: boolean
        default: false
      rebuild_all:
        description: "Build PRoot, the sources and the rebuilt packages anew, even if built before of the same?"
        type: boolean
        default: false

permissions:
  contents: write

# One at a time: each release's tag and parts build on the one before. A newer run cancels the one
# going (what it would release is out of date)
concurrency:
  group: build
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # JOB 1: Calculate Version ID
  # ------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc_ver.outputs.version }}
      matrix: ${{ steps.abis.outputs.matrix }}
      abis: ${{ steps.abis.outputs.abis }}
      previous: ${{ steps.plan.outputs.previous }}
      proot_ref: ${{ steps.plan.outputs.ref }}
      talloc: ${{ steps.plan.outputs.talloc }}
      build_proot: ${{ steps.plan.outputs.build_proot }}
      build_openjdk8: ${{ steps.plan.outputs.build_openjdk8 }}
      openjdk8_ref: ${{ steps.plan.outputs.openjdk8_ref }}
      openjdk8_ref_arm: ${{ steps.plan.outputs.openjdk8_ref_arm }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read ABIs
        id: abis
        run: |
          # One build per ABI of config.yaml's android.abis, in the image and on the runner it says; the
          # 64-bit ones are checked for 16 KB pages (32-bit ABIs never run with them)
          echo "matrix=$(yq -o=json -I=0 '[.android.abis | to_entries[] | {"abi": .key, "arch": .value.termux_arch,
            "runner": .value.runner, "check_16k": (.key | test("64"))}]' config.yaml)" >> $GITHUB_OUTPUT
          echo "abis=$(yq -o=json -I=0 '[.android.abis | keys[]]' config.yaml)" >> $GITHUB_OUTPUT

      - name: What to Build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD_ALL: ${{ inputs.rebuild_all }}
        run: |
          # PRoot and the sources are built anew only when what they're built of changed since the
          # latest release (its parts.json: the core's PRoot, the sources' keys; rootfs/release.py), or
          # for other ABIs; else they're that release's (the reuse jobs)
          PREVIOUS=$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName \
            --jq '.[0].tagName // empty' || true)
          echo "previous=$PREVIOUS" >> $GITHUB_OUTPUT
          mkdir -p prev
          [ -n "$PREVIOUS" ] && gh release download "$PREVIOUS" -p parts.json -D prev || echo '{}' > prev/parts.json
          yq -o=json '.' config.yaml > config.json
          ABIS=$(yq -o=json -I=0 '[.android.abis | keys[]] | sort' config.yaml)
          same_abis() { [ "$(jq -c --arg p "$1" '[.parts[$p].abis // {} | keys[]] | sort' prev/parts.json)" = "$ABIS" ]; }

          # PRoot: its versions resolved now ("latest"), built of those only
          VERSIONS=$(bash proot/build.sh --versions)
          echo "$VERSIONS" >> $GITHUB_OUTPUT
          jq -n --arg ref "$(sed -n 's/^ref=//p' <<< "$VERSIONS")" --arg talloc "$(sed -n 's/^talloc=//p' <<< "$VERSIONS")" \
            --arg ndk "$(yq -r '.proot.ndk' config.yaml)" --arg api "$(yq -r '.proot.api' config.yaml)" \
            '{ref: $ref, talloc: $talloc, ndk: $ndk, api: $api}' > proot.json
          NEW=$(python3 rootfs/release.py proot-key proot.json | jq -S -c .)
          OLD=$(jq -S -c '.parts.core.proot // empty' prev/parts.json)
          if [ "$REBUILD_ALL" != true ] && [ "$NEW" = "$OLD" ] && same_abis core; then
            echo "build_proot=false" >> $GITHUB_OUTPUT
            echo "::notice::PRoot: as in $PREVIOUS ($NEW)"
          else
            echo "build_proot=true" >> $GITHUB_OUTPUT
          fi

          # OpenJDK 8 (the part made of it, jdk8): its tags resolved now ("latest"), built of those only
          VERSIONS=$(bash rootfs/openjdk8/build.sh --versions)
          sed 's/^/openjdk8_/' <<< "$VERSIONS" >> $GITHUB_OUTPUT
          jq --arg ref "$(sed -n 's/^ref=//p' <<< "$VERSIONS")" --arg ref_arm "$(sed -n 's/^ref_arm=//p' <<< "$VERSIONS")" \
            '.sources.openjdk8.ref = $ref | .sources.openjdk8.ref_arm = $ref_arm' config.json > config.resolved.json
          mv config.resolved.json config.json
          PART=$(yq -r '.rootfs.parts | to_entries[] | select(.value.source == "openjdk8") | .key' config.yaml)
          NEW=$(python3 rootfs/release.py source-key config.json openjdk8)
          OLD=$(jq -r '.sources.openjdk8 // empty' prev/parts.json)
          if [ "$REBUILD_ALL" != true ] && [ "$NEW" = "$OLD" ] && same_abis "$PART"; then
            echo "build_openjdk8=false" >> $GITHUB_OUTPUT
            echo "::notice::OpenJDK 8: as in $PREVIOUS ($NEW)"
          else
            echo "build_openjdk8=true" >> $GITHUB_OUTPUT
          fi

      - name: Calculate Next Version
        id: calc_ver
        run: |
          BASE_VER=$(date +'%y.%m.%d')
          NEW_TAG="$BASE_VER"
          EXISTING_TAGS=$(git tag -l "${BASE_VER}*")
            
          if [[ "$EXISTING_TAGS" == *"$BASE_VER"* ]]; then
             for suffix in a b c d e f g; do
               if [[ "$EXISTING_TAGS" != *"${BASE_VER}${suffix}"* ]]; then
                 NEW_TAG="${BASE_VER}${suffix}"
                 break
               fi
             done
          fi
          echo "version=$NEW_TAG" >> $GITHUB_OUTPUT

  # ------------------------------------------------------------------
  # JOB 2: PRoot and its loaders, and the sources (config.yaml's: OpenJDK 8's JRE), in parallel
  # ------------------------------------------------------------------
  # Each built anew only when what it's built of changed (prepare); else the reuse jobs below give the
  # same artifacts, of the latest release
  proot:
    needs: prepare
    if: needs.prepare.outputs.build_proot == 'true'
    uses: ./.github/workflows/build-proot.yml
    with:
      ref: ${{ needs.prepare.outputs.proot_ref }}
      talloc: ${{ needs.prepare.outputs.talloc }}

  openjdk8:
    needs: prepare
    if: needs.prepare.outputs.build_openjdk8 == 'true'
    uses: ./.github/workflows/build-openjdk8.yml
    with:
      ref: ${{ needs.prepare.outputs.openjdk8_ref }}
      ref_arm: ${{ needs.prepare.outputs.openjdk8_ref_arm }}

  reuse-proot:
    name: PRoot of ${{ needs.prepare.outputs.previous }}
    needs: prepare
    if: needs.prepare.outputs.build_proot == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Take PRoot
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ needs.prepare.outputs.previous }}
          ABIS: ${{ needs.prepare.outputs.abis }}
        run: |
          # The latest release's (with its core), per ABI as build-proot.yml makes it
          gh release download "$PREVIOUS" -R "$GITHUB_REPOSITORY" -p rootfs.tar.gz
          mkdir proot
          tar -xzf rootfs.tar.gz -C proot --wildcards $(jq -r '.[] | "./\(.)/libproot*.so"' <<< "$ABIS")
          ls -R proot

      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proot
          path: proot/

  reuse-openjdk8:
    name: OpenJDK 8 of ${{ needs.prepare.outputs.previous }} (${{ matrix.abi }})
    needs: prepare
    if: needs.prepare.outputs.build_openjdk8 == 'false'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: ${{ fromJSON(needs.prepare.outputs.abis) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Take OpenJDK 8
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ needs.prepare.outputs.previous }}
          ABI: ${{ matrix.abi }}
        run: |
          # The latest release's part of it, as build-openjdk8.yml's artifact: its files (without the
          # list the rootfs build adds) and what it is (the part's first component: "name version")
          PART=$(yq -r '.rootfs.parts | to_entries[] | select(.value.source == "openjdk8") | .key' config.yaml)
          gh release download "$PREVIOUS" -p rootfs.tar.gz -p parts.json
          tar -xzf rootfs.tar.gz "./$ABI/libpackage-$PART.tar.xz.so"
          mkdir -p "out/$ABI"
          tar -xpJf "$ABI/libpackage-$PART.tar.xz.so" -C "out/$ABI"
          rm -rf "out/$ABI/etc/extensions"
          rmdir "out/$ABI/etc" 2>/dev/null || true
          jq --arg p "$PART" --arg abi "$ABI" '.parts[$p].abis[$abi].components[0] | split(" ")
            | {name: .[0], version: .[1]}' parts.json > "out/info-$ABI.json"
          cat "out/info-$ABI.json"
          tar -cf "openjdk8-$ABI.tar" -C out "./$ABI" "./info-$ABI.json"

      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openjdk8-${{ matrix.abi }}
          path: openjdk8-${{ matrix.abi }}.tar

  # ------------------------------------------------------------------
  # JOB 3: The rootfs, an ABI each (parallel), once the sources it puts in (as their parts) are built
  # ------------------------------------------------------------------
  build:
    name: Build ${{ matrix.arch }}
    needs: [prepare, openjdk8, reuse-openjdk8]
    # Once OpenJDK 8 is there, built or reused (one of them is skipped)
    if: >-
      !cancelled() && needs.prepare.result == 'success'
      && (needs.openjdk8.result == 'success' || needs.reuse-openjdk8.result == 'success')
    # Every image runs natively: x86 ones on x86_64 runners, ARM ones on ARM runners
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Built Sources
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openjdk8-${{ matrix.abi }}
          path: built/openjdk8

      - name: Rebuilt Before
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ needs.prepare.outputs.previous }}
          REBUILD_ALL: ${{ inputs.rebuild_all }}
        run: |
          # What the latest release's build built with Termux's recipes (rebuilt packages, 16 KB
          # rebuilds), each as <key>.tar: termux-build.sh takes what's built of the same again
          mkdir -p rebuilt-cache
          if [ -n "$PREVIOUS" ] && [ "$REBUILD_ALL" != true ] \
            && gh release download "$PREVIOUS" -R "$GITHUB_REPOSITORY" -p "rebuilt-${{ matrix.arch }}.tar"; then
            tar -xf "rebuilt-${{ matrix.arch }}.tar" -C rebuilt-cache
            rm "rebuilt-${{ matrix.arch }}.tar"
          fi
          ls -la rebuilt-cache

      - name: Build Rootfs
        env:
          IMAGE: termux/termux-docker:${{ matrix.arch }}
          IMAGE_VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
          ABI: ${{ matrix.abi }}
        run: |
          mkdir -p "out/$ARCH" manifests
          # What rootfs/build.sh builds (as its packages and build_packages): config.yaml's rootfs parts
          # of Termux's packages (not those built here, put in below) built for this ABI (a part's abis;
          # all of them without)
          CONFIG=$(yq -o=json -I=0 '{"packages": (.rootfs.parts | with_entries(select(.value.source == null))
            | with_entries(select((.value.abis // [strenv(ABI)]) | any_c(. == strenv(ABI))))),
            "build_packages": .rootfs.build_packages}' config.yaml)

          # Privileged: ARM images need personality(), even on ARM hosts (see termux-docker's README)
          docker run --privileged --name rootfs -v "$PWD/rootfs:/build:ro" -v "$PWD/rebuilt-cache:/rebuilt:ro" "$IMAGE" \
            bash /build/build.sh "$IMAGE_VERSION" "$CONFIG" /rebuilt

          HOME_DIR=/data/data/com.termux/files/home
          docker cp "rootfs:$HOME_DIR/rootfs" stage
          docker cp "rootfs:$HOME_DIR/out/." manifests
          docker rm rootfs
          # What it built with Termux's recipes (or took again), for the next release
          mkdir -p manifests/rebuilt
          tar -cf "out/rebuilt-$ARCH.tar" -C manifests/rebuilt .
          rm -rf manifests/rebuilt

          # The parts built here (a part's source, e.g. jdk8's openjdk8: build-openjdk8.yml), their files as that build
          # made them: listed for the app to delete them again (as build.sh lists the others'), with what
          # they hold
          for p in $(yq -r '.rootfs.parts | to_entries[] | select(.value.source) | .key' config.yaml); do
            src=$(yq -r ".rootfs.parts.$p.source" config.yaml)
            mkdir -p "stage/$p" "built/$src/out"
            tar -xf "built/$src/$src-$ABI.tar" -C "built/$src/out"
            cp -a "built/$src/out/$ABI/." "stage/$p/"
            mkdir -p "stage/$p/etc/extensions"
            (cd "stage/$p" && find . \( -type f -o -type l \) -print | sed 's|^\./||' | sort) > "$p.files"
            mv "$p.files" "stage/$p/etc/extensions/$p.files"
            info="built/$src/out/info-$ABI.json"
            jq -r '"\(.name)-\(.version)"' "$info" > "manifests/manifest-$p.txt"
            jq -r '"\(.name) \(.version)"' "$info" > "manifests/components-$p.txt"
          done

          # One archive per part: the core and an extension per package (see config.yaml), packed
          # side by side (rootfs/pack.sh)
          for dir in stage/*/; do
            part=$(basename "$dir")
            lib="libpackage-$part.tar.xz.so"
            bash rootfs/pack.sh "$dir" "$ARCH" "out/$ARCH/$lib" &
            mv "manifests/manifest-$part.txt" "out/manifest-$part-$ARCH.txt"
          done
          for job in $(jobs -p); do wait "$job"; done
          du -sh stage/* out/"$ARCH"/*
          # Each part's size unpacked and as an archive, and what it holds, for parts.json
          python3 rootfs/release.py sizes stage "out/$ARCH" manifests > "out/sizes-$ARCH.json"

      - name: Check Android Libraries
        run: |
          # Nothing may link Android's framework libraries: libandroid (and what links it) pulls in
          # libhwui, whose vendor libraries a program run from /data can't find on some devices
          bad=0
          while IFS= read -r -d '' f; do
            needed=$(readelf -dW "$f" 2>/dev/null | grep -oE '\[(libandroid|libmediandk|libhwui|libcamera2ndk)\.so\]' | tr '\n' ' ' || true)
            if [ -n "$needed" ]; then
              echo "::error::${f#stage/} links $needed"
              bad=1
            fi
          done < <(find stage -type f -size +0 -print0)
          exit $bad

      - name: Check 16 KB Alignment
        if: matrix.check_16k
        run: |
          # Every ELF must load with 16 KB pages (Android 15+ devices and Android 17 emulators)
          bad=0
          while IFS= read -r -d '' f; do
            for align in $(readelf -lW "$f" 2>/dev/null | awk '$1 == "LOAD" { print $NF }'); do
              if (( align < 16384 )); then
                echo "::error::${f#stage/}: LOAD segment aligned to $align"
                bad=1
                break
              fi
            done
          done < <(find stage -type f -size +0 -print0)
          exit $bad

      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-data-${{ matrix.arch }}
          path: out/

  # ------------------------------------------------------------------
  # JOB 4: Release & Compare
  # ------------------------------------------------------------------
  release:
    needs: [prepare, build, proot, reuse-proot]
    # Once PRoot is there, built or reused (one of them is skipped)
    if: >-
      !cancelled() && needs.build.result == 'success'
      && (needs.proot.result == 'success' || needs.reuse-proot.result == 'success')
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Current Build Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-data-*
          path: current_assets
          merge-multiple: true

      - name: Fetch Previous Release
        id: fetch_prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev_assets prev_package

          # The latest release (the rootfs and PRoot)
          LATEST_TAG=$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName \
            --jq '.[0].tagName // empty' || echo "")

          echo "Latest detected tag: [$LATEST_TAG]"

          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" == "null" ]; then
            echo "is_initial=true" >> $GITHUB_OUTPUT
            echo "::notice::No previous release found."
          else
            echo "is_initial=false" >> $GITHUB_OUTPUT
            # One per part (earlier releases: per part and ABI); a part missing there counts as all new
            gh release download "$LATEST_TAG" -p 'manifest-*.txt' -D prev_assets || echo "No manifests in $LATEST_TAG"
            # Its parts, to keep those that didn't change (earlier releases have no parts.json: all are new)
            if gh release download "$LATEST_TAG" -p parts.json -D prev_package; then
              gh release download "$LATEST_TAG" -p rootfs.tar.gz -D prev_assets
              tar -xzf prev_assets/rootfs.tar.gz -C prev_package --exclude parts.json
            else
              echo "No parts.json in $LATEST_TAG: every part is built anew"
            fi
          fi

      - name: Merge Manifests
        run: |
          # One per part: what all ABIs have as it is, what differs (e.g. Termux's repo not synced
          # for all of them yet) with its ABI, e.g. "python-3.13.7 @arm". A part built for some ABIs
          # only (its abis) over those
          ALL_ARCHES=$(yq -r '.android.abis[].termux_arch' config.yaml)
          mkdir -p manifests
          for part in $(yq -r '.rootfs.parts | keys[]' config.yaml); do
            ARCHES=$(for arch in $ALL_ARCHES; do
              if [ -f "current_assets/manifest-$part-$arch.txt" ]; then echo "$arch"; fi
            done)
            first="current_assets/manifest-$part-$(echo "$ARCHES" | head -n 1).txt"
            common=$(cat "$first")
            for arch in $ARCHES; do
              common=$(comm -12 <(echo "$common") <(sort "current_assets/manifest-$part-$arch.txt"))
            done
            {
              [ -n "$common" ] && echo "$common"
              for arch in $ARCHES; do
                comm -23 <(sort "current_assets/manifest-$part-$arch.txt") <(echo "$common") | sed "s/\$/ @$arch/"
              done
            } | sort > "manifests/manifest-$part.txt"
          done

      - name: Download PRoot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proot
          path: proot_out

      - name: Pick Parts
        env:
          PROOT_REF: ${{ needs.prepare.outputs.proot_ref }}
          TALLOC_VERSION: ${{ needs.prepare.outputs.talloc }}
          OPENJDK8_REF: ${{ needs.prepare.outputs.openjdk8_ref }}
          OPENJDK8_REF_ARM: ${{ needs.prepare.outputs.openjdk8_ref_arm }}
        run: |
          # A part keeps the previous release's archive and version unless what goes into it
          # changed (rootfs/release.py); final_package gets every ABI's archives and its own parts list
          # (libparts.json.so, the app's); parts.json, of them all, is a release asset of its own (for the next one).
          # PRoot ships with the core: a new PRoot or talloc version (or NDK, or proot/ script or
          # patch) is a new core, with this build's PRoot; else the core keeps the previous one's
          # (OpenJDK 8's tags as prepare resolved them: what its key was of)
          yq -o=json '.' config.yaml | jq --arg ref "$OPENJDK8_REF" --arg ref_arm "$OPENJDK8_REF_ARM" \
            '.sources.openjdk8.ref = $ref | .sources.openjdk8.ref_arm = $ref_arm' > config.json
          jq -n --arg ref "$PROOT_REF" --arg talloc "$TALLOC_VERSION" \
            --arg ndk "$(yq -r '.proot.ndk' config.yaml)" --arg api "$(yq -r '.proot.api' config.yaml)" \
            '{ref: $ref, talloc: $talloc, ndk: $ndk, api: $api}' > proot.json
          python3 rootfs/release.py merge "${{ needs.prepare.outputs.version }}" config.json \
            current_assets manifests prev_package final_package proot_out proot.json
          mv final_package/changed.txt changed.txt
          mv final_package/parts.json parts.json
          # PRoot (the one shipped) in the core's manifest, a package as the rest (after merge: its
          # fingerprint has PRoot apart); "5.1.107.101_talloc-2.5.0", as the app lists it
          jq -r '.parts.core.proot | "proot-\(.ref | ltrimstr("v"))_talloc-\(.talloc)"' parts.json >> manifests/manifest-core.txt
          sort -o manifests/manifest-core.txt manifests/manifest-core.txt

      - name: Read PRoot
        id: proot
        run: |
          # The PRoot shipped (Pick Parts put it in each ABI's jniLibs folder with the core): this
          # build's with a new core, else the previous release's
          jq -r '.parts.core.proot | "ref=\(.ref)", "talloc=\(.talloc)", "ndk=\(.ndk)", "api=\(.api)"' parts.json >> $GITHUB_OUTPUT

      - name: OpenJDK 8's sources
        id: openjdk8
        env:
          REF: ${{ needs.prepare.outputs.openjdk8_ref }}
          REF_ARM: ${{ needs.prepare.outputs.openjdk8_ref_arm }}
        run: |
          # OpenJDK's tag, and its AArch32 port's (armeabi-v7a), as prepare resolved them
          # Parenthesised: yq's pipe binds tighter than its comma (the rest read from the root: null)
          yq -r '.sources.openjdk8 | ("repo=\(.repo)", "repo_arm=\(.repo_arm)", "ndk=\(.ndk)", "api=\(.api)")' config.yaml >> $GITHUB_OUTPUT
          { echo "ref=$REF"; echo "ref_arm=$REF_ARM"; } >> $GITHUB_OUTPUT

      - name: Generate Changelog
        id: changelog
        run: |
          # Parts as built, the core first
          PARTS=$(ls manifests/manifest-*.txt | sed 's|.*/manifest-||; s|\.txt$||' \
            | awk '{ print ($0 == "core" ? 0 : 1), $0 }' | sort | cut -d' ' -f2)

          # "name-1.2" (Termux) or "name==1.2" (pip), maybe with " @arch", as "name[ (arch)] version"
          parse_line() {
            local line=$1 arch=""
            if [[ "$line" == *" @"* ]]; then arch=" (${line##* @})"; line=${line% @*}; fi
            if [[ "$line" == *==* ]]; then
              echo "${line%%==*}$arch|${line#*==}"
            else
              local pkg="${line%%-[0-9]*}"
              echo "$pkg$arch|${line#${pkg}-}"
            fi
          }

          read_manifest() {
            local -n into=$1
            local line key
            while read -r line; do
              [ -z "$line" ] && continue
              key=$(parse_line "$line")
              into["${key%%|*}"]="${key#*|}"
            done < <(cat "$2" 2>/dev/null || true)
          }

          FINAL_LOG=""
          for part in $PARTS; do
            declare -A OLD=() NEW=()
            prev="prev_assets/manifest-$part.txt"
            # Earlier releases had one per ABI
            [ -f "$prev" ] || prev="prev_assets/manifest-$part-x86_64.txt"
            read_manifest OLD "$prev"
            read_manifest NEW "manifests/manifest-$part.txt"

            # Line by line: names may have a space ("python (arm)")
            ROWS=$(printf "%s\n" "${!OLD[@]}" "${!NEW[@]}" | sort -u | while IFS= read -r pkg; do
              [ -z "$pkg" ] && continue
              old="${OLD[$pkg]:-}" new="${NEW[$pkg]:-}"
              if [[ -n "$old" && -n "$new" ]]; then
                if [[ "$old" != "$new" ]]; then echo "| ⬆️ | \`$pkg\` | \`$old\` | \`$new\` |"; fi
              elif [[ -n "$old" ]]; then
                echo "| ❌ | \`$pkg\` | \`$old\` | - |"
              else
                echo "| 🟢 | \`$pkg\` | - | \`$new\` |"
              fi
            done | sort)
            unset OLD NEW

            if [ -n "$ROWS" ]; then
              lib="libpackage-$part.tar.xz.so"
              FINAL_LOG+="### 📦 $part (\`$lib\`)"$'\n\n'"| ● | Package | Old | New |"$'\n'"|:--:|:--------|:----|:-----|"$'\n'"$ROWS"$'\n\n'
            fi
          done

          # A release is needed when a part got a new version (its packages, its config or the
          # build scripts changed; the core's: or PRoot); the others ship as they were
          if [ -s changed.txt ]; then CHANGES_DETECTED="true"; else CHANGES_DETECTED="false"; fi
          VERSIONS="| Part | Version | |"$'\n'"|:-----|:--------|:--:|"$'\n'
          for part in $(jq -r '.parts | keys_unsorted[]' parts.json); do
            version=$(jq -r --arg p "$part" '.parts[$p].version' parts.json)
            mark=""
            if grep -qx "$part" changed.txt; then mark="🆕"; fi
            VERSIONS+="| \`$part\` | \`$version\` | $mark |"$'\n'
          done

          if [ "${{ steps.fetch_prev.outputs.is_initial }}" == "true" ]; then
            CHANGES_DETECTED="true"
            FINAL_LOG="Initial Release."
          elif [ -n "$FINAL_LOG" ]; then
            FINAL_LOG="## 🚀 Changes"$'\n\n'"$FINAL_LOG"
          fi
          FINAL_LOG="## 🧩 Parts"$'\n\n'"$VERSIONS"$'\n'"$FINAL_LOG"

          # A push changes what's built or how it's released (e.g. what the app gets of it): always a release
          if [ "${{ inputs.force_release }}" == "true" ] || [ "${{ github.event_name }}" == "push" ]; then
            CHANGES_DETECTED="true"
          fi

          echo "needed=$CHANGES_DETECTED" >> $GITHUB_OUTPUT
          printf "full_log<<EOF\n%s\nEOF\n" "$FINAL_LOG" >> $GITHUB_OUTPUT

      - name: Package Artifacts
        if: steps.changelog.outputs.needed == 'true'
        run: |
          # Every ABI's jniLibs folder (the parts as Pick Parts chose them, their list, and PRoot), for the app
          echo "==> Creating Master Archive..."
          tar -czf rootfs.tar.gz -C final_package .
          tar -tzvf rootfs.tar.gz

      - name: Push Release
        if: steps.changelog.outputs.needed == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: Release ${{ needs.prepare.outputs.version }}
          body: |
              ## Automated Build ${{ needs.prepare.outputs.version }}
              Base: [Termux packages](https://github.com/termux/termux-packages)
              PRoot: [`termux/proot@${{ steps.proot.outputs.ref }}`](https://github.com/termux/proot/tree/${{ steps.proot.outputs.ref }}), talloc `${{ steps.proot.outputs.talloc }}`; NDK ${{ steps.proot.outputs.ndk }}, min API ${{ steps.proot.outputs.api }}
              OpenJDK 8: [`${{ steps.openjdk8.outputs.repo }}@${{ steps.openjdk8.outputs.ref }}`](https://github.com/${{ steps.openjdk8.outputs.repo }}/tree/${{ steps.openjdk8.outputs.ref }}), armeabi-v7a: [`${{ steps.openjdk8.outputs.repo_arm }}@${{ steps.openjdk8.outputs.ref_arm }}`](https://github.com/${{ steps.openjdk8.outputs.repo_arm }}/tree/${{ steps.openjdk8.outputs.ref_arm }}); NDK ${{ steps.openjdk8.outputs.ndk }}, min API ${{ steps.openjdk8.outputs.api }}
              ABIs: ${{ join(fromJSON(needs.prepare.outputs.matrix).*.abi, ', ') }}
              
              ${{ steps.changelog.outputs.full_log }}
          # rebuilt-<arch>.tar: what its builds built with Termux's recipes, which the next one takes again
          files: |
            rootfs.tar.gz
            parts.json
            manifests/manifest-*.txt
            current_assets/rebuilt-*.tar
          make_latest: true
