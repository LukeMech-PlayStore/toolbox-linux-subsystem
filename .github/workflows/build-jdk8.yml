name: Build JDK 8

# OpenJDK 8's JRE for every ABI (config.yaml's jdk8 section and abis), cross-compiled with the NDK
# (rootfs/jdk8/build.sh): a job of build.yml, whose build puts it in the rootfs as the jdk8 part. Run by hand,
# it just builds it (an artifact per ABI, no release)
on:
  workflow_call:
  workflow_dispatch:
  push: # TEMPORARY: building it on its branch, before it goes to main
    branches: [jdk8, jdk8-clang]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
      ndk: ${{ steps.config.outputs.ndk }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Config
        id: config
        run: |
          echo "matrix=$(yq -o=json -I=0 '[.abis | keys[]]' config.yaml)" >> $GITHUB_OUTPUT
          echo "ndk=$(yq -r '.jdk8.ndk' config.yaml)" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.abi }}
    needs: prepare
    # The NDK runs on x86_64 Linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Android NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: setup-ndk
        with:
          ndk-version: ${{ needs.prepare.outputs.ndk }}

      - name: Setup Boot JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 8

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install autoconf unzip zip patchelf systemtap-sdt-dev gcc-multilib g++-multilib \
            libxtst-dev libxrender-dev libxt-dev libxrandr-dev libasound2-dev libcups2-dev libelf-dev libfontconfig1-dev libx11-dev

      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: bash rootfs/jdk8/build.sh "${{ matrix.abi }}"

      - name: Pack
        # As a tar: an artifact keeps no file modes (java's)
        run: tar -cf "jdk8-${{ matrix.abi }}.tar" -C rootfs/jdk8/out .

      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jdk8-${{ matrix.abi }}
          path: jdk8-${{ matrix.abi }}.tar
